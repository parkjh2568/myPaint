[package]
name = "mypaint-desktop"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
rfd = "0.17.2"
tempfile = "3.27.0"
fs2 = "0.4"

serde_json = "1"
base64 = "0.23.1"
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
