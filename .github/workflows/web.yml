name: Web build and browser tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build python3 libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev
      - name: Prepare matching Qt host tools from pinned sources
        run: |
          git clone --no-checkout https://github.com/qt/qtbase.git build-tools/qtbase
          git -C build-tools/qtbase checkout --detach 025bdad181de241e81bf853c8a2d7bf3d19261a9
          mkdir -p build-tools/qt-host-build
          cd build-tools/qt-host-build
          ../qtbase/configure -release -static -nomake tests -nomake examples -no-opengl \
            -no-feature-network -no-feature-dbus -no-feature-sql -no-feature-testlib \
            -no-feature-printsupport -no-openssl -prefix "$GITHUB_WORKSPACE/build-tools/qt-host"
          cmake --build . --parallel 2
          cmake --install .
      - name: Prepare Emscripten and exception-enabled Qt Wasm
        run: |
          git clone https://github.com/emscripten-core/emsdk.git build-tools/emsdk
          build-tools/emsdk/emsdk install 5.0.5
          build-tools/emsdk/emsdk activate 5.0.5
          source build-tools/emsdk/emsdk_env.sh
          mkdir -p build-tools/qt-wasm-build
          cd build-tools/qt-wasm-build
          ../qtbase/configure -release -static -no-feature-thread -feature-wasm-exceptions \
            -nomake tests -nomake examples -no-feature-network -no-feature-dbus \
            -no-feature-sql -no-feature-testlib -no-feature-printsupport -no-openssl \
            -qt-host-path "$GITHUB_WORKSPACE/build-tools/qt-host" -platform wasm-emscripten \
            -prefix "$GITHUB_WORKSPACE/build-tools/qt-wasm"
          cmake --build . --parallel 2
          cmake --install .
      - name: Package and exercise local staging
        run: |
          python3 tools/build_web.py --host-qt "$GITHUB_WORKSPACE/build-tools/qt-host" --no-stage
          python3 -m unittest discover -s tests -p test_stage_web.py
          mkdir -p "$RUNNER_TEMP/paint-site"
          git -C "$RUNNER_TEMP/paint-site" init --quiet
          python3 tools/stage_web.py dist/web "$RUNNER_TEMP/paint-site"
      - name: Test actual staged application and browser failure boundaries
        run: |
          npm install --prefix "$RUNNER_TEMP/paint-browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/paint-browser/node_modules/.bin/playwright" install --with-deps chromium
          python3 -m http.server 8000 --bind 127.0.0.1 --directory "$RUNNER_TEMP/paint-site" > build-web-work/ci-http.log 2>&1 &
          web_server_pid=$!
          trap 'kill "$web_server_pid"' EXIT
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/paint-browser/node_modules/playwright/index.mjs"
          export PAINT_TEST_URL=http://127.0.0.1:8000/mypaint/
          export PAINT_TEST_PACKAGE=1
          node tests/web_browser.mjs
          node tests/web_storage.mjs
