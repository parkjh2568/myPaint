name: Qt-free web and desktop
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - name: Check and build static application
        working-directory: web-app
        run: |
          npm ci --no-fund
          npm run format:check
          npm test
      - name: Verify local bundle and staging failure paths
        run: |
          python3 tests/test_stage_web.py
          python3 tests/test_build_studio.py
          python3 tools/build_studio.py
      - name: Exercise production assets at the Pages subpath
        shell: bash
        working-directory: web-app
        run: |
          npx --no-install playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/studio-site"
          git -C "$RUNNER_TEMP/studio-site" init -q
          python3 ../tools/stage_web.py ../dist/studio "$RUNNER_TEMP/studio-site" --check
          python3 ../tools/stage_web.py ../dist/studio "$RUNNER_TEMP/studio-site"
          python3 -m http.server 8922 --bind 127.0.0.1 --directory "$RUNNER_TEMP/studio-site" > "$RUNNER_TEMP/studio-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          export PAINT_TEST_URL=http://127.0.0.1:8922/mypaint/
          npm run test:browser
          npm run test:usability
          npm run test:fill-failure
          npm run test:gif-input
          npm run test:jpeg-orientation
          npm run test:native-profile
          npm run test:native-persistence
          npm run test:native-recovery-flow
          npm run test:spray-contract
          npm run test:bulk-edit
          PAINT_RENDER_PREPARATION_OUTPUT="$RUNNER_TEMP/studio-render-preparation/results.json" npm run test:render-preparation
          npm run test:pointer-contract
          npm run test:color-eraser-contract
          npm run test:shape-color-contract
          npm run test:roundrect-contract
          npm run test:export-preview
          npm run test:touch-viewport
          npm run test:camera-viewport
          npm run test:recovery-contract
          npm run test:codec-reply
          npm run test:alpha-contract
          npm run test:selection-preparation
          npm run test:selection-resize
          npm run test:selection-contract
          npm run test:selection-source
          npm run test:masked-transform
          npm run test:fill-key
          npm run test:cut-key
          npm run test:eraser-picker-contract
          npm run test:square-contract
          npm run test:pending-contract
          npm run test:clipboard-contract
          npm run test:tiles
          npm run test:scene-contract
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: 1.94.0
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned compiler and JS dependencies
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
          npm ci --no-fund
      - name: Check native failure paths and build host package
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          npm run desktop:build
