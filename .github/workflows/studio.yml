name: Qt-free web and desktop
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            suites: test:browser test:usability test:fill-failure test:gif-input test:jpeg-orientation test:native-profile test:native-persistence test:native-recovery-flow test:spray-contract test:bulk-edit test:render-preparation
          - group: drawing
            suites: test:pointer-contract test:color-eraser-contract test:shape-color-contract test:roundrect-contract test:export-preview
          - group: viewport
            suites: test:touch-viewport test:camera-viewport test:recovery-contract test:codec-reply test:alpha-contract
          - group: selection
            suites: test:selection-preparation test:selection-resize test:selection-contract test:selection-source test:masked-transform test:fill-key test:cut-key test:eraser-picker-contract test:square-contract test:clipboard-contract
          - group: pending
            suites: test:pending-contract
          - group: raster
            suites: test:tiles test:scene-contract
    name: web (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - name: Check and build static application
        working-directory: web-app
        run: |
          npm ci --no-fund
          npm run format:check
          npm test
      - name: Verify local bundle and staging failure paths
        run: |
          python3 tests/test_stage_web.py
          python3 tests/test_build_studio.py
          python3 tools/build_studio.py
      - name: Exercise production assets at the Pages subpath
        env:
          BROWSER_SUITES: ${{ matrix.suites }}
        shell: bash
        working-directory: web-app
        run: |
          npx --no-install playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/studio-site"
          git -C "$RUNNER_TEMP/studio-site" init -q
          python3 ../tools/stage_web.py ../dist/studio "$RUNNER_TEMP/studio-site" --check
          python3 ../tools/stage_web.py ../dist/studio "$RUNNER_TEMP/studio-site"
          python3 -m http.server 8922 --bind 127.0.0.1 --directory "$RUNNER_TEMP/studio-site" > "$RUNNER_TEMP/studio-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          export PAINT_TEST_URL=http://127.0.0.1:8922/mypaint/
          export PAINT_RENDER_PREPARATION_OUTPUT="$RUNNER_TEMP/studio-render-preparation/results.json"
          status=0
          for suite in $BROWSER_SUITES; do
            echo "::group::$suite"
            if npm run "$suite"; then
              echo "PASS $suite"
            else
              echo "::error::$suite failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: 1.94.0
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      # Keep native commands in separate steps. On Windows, a later successful
      # command can otherwise mask an earlier nonzero native exit in PowerShell.
      - name: Install pinned Rust compiler
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Install JS dependencies
        run: npm ci --no-fund
      - name: Check native formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Lint native code
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test native failure paths
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build host package
        run: npm run desktop:build
