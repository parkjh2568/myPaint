name: Native build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check C++ format
        run: |
          clang-format-18 --version
          clang-format-18 --dry-run --Werror src/*.cpp src/*.h tests/*.cpp tests/wasm_probe/*.cpp
  minimum-qt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install system Qt baseline
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-base-dev-tools qt6-qpa-plugins libgl1-mesa-dev fonts-nanum
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --parallel 2 --output-on-failure
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            host: linux
            arch: linux_gcc_64
          - os: macos-15
            host: mac
            arch: clang_64
          - os: windows-2022
            host: windows
            arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      QT_VERSION: 6.8.3
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libegl1
      - name: Install pinned build tool and Qt test baseline
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt '${{ matrix.host }}' desktop "$QT_VERSION" '${{ matrix.arch }}' -O "$RUNNER_TEMP/Qt"
          python - <<'PY'
          import os
          from pathlib import Path
          root = next(Path(os.environ['RUNNER_TEMP'], 'Qt').rglob('Qt6Config.cmake')).parents[3]
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f'QT_ROOT={root.as_posix()}\nQT_PLUGIN_PATH={(root / "plugins").as_posix()}\n')
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as f:
              f.write(str(root / 'bin') + '\n')
          PY
      - name: Configure
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="$QT_ROOT" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --parallel 2 --output-on-failure
